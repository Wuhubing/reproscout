name: Docker reproduction acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-reproduction-acceptance
  cancel-in-progress: false
jobs:
  fixed-example:
    if: github.actor == github.repository_owner && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.8.3'
          enable-cache: false
      - run: uv sync --locked --python 3.12
      - name: Run fixed scientific example through the actual controller
        run: uv run python scripts/actions_acceptance.py
        env:
          OPENAI_API_KEY: ${{ secrets.REPROSCOUT_CI_OPENAI_API_KEY }}
      - name: Retain acceptance evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproduction-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions-evidence/
          retention-days: 1
          if-no-files-found: error
