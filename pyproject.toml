[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reproscout"
version = "0.9.0"
description = "Local scientific reproduction review with evidence and auditable lessons."
requires-python = ">=3.11,<3.14"
dependencies = [
    "inspect-ai==0.3.290",
    "httpx",
    "numpy",
    "scipy",
    "openai>=3.53.0",
    "pillow>=13.0.0",
    "pymupdf>=2.1",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
reproscout = "reproscout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
